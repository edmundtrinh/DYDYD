name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_profile:
        description: EAS build profile to test against
        required: false
        default: development
        type: choice
        options:
          - development
          - preview

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download latest Android APK from EAS
        id: download-apk
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event.inputs.build_profile || 'development' }}"
          echo "Looking for latest $PROFILE Android build..."

          BUILD_JSON=$(eas build:list \
            --platform android \
            --status finished \
            --distribution internal \
            --limit 1 \
            --non-interactive \
            --json 2>/dev/null || echo "[]")

          if [ "$BUILD_JSON" = "[]" ] || [ "$(echo "$BUILD_JSON" | jq 'length')" = "0" ]; then
            echo "No finished Android builds found. Triggering a new build..."
            eas build --platform android --profile "$PROFILE" --non-interactive --wait
            BUILD_JSON=$(eas build:list \
              --platform android \
              --status finished \
              --distribution internal \
              --limit 1 \
              --non-interactive \
              --json)
          fi

          BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "::error::Could not get APK download URL from EAS"
            exit 1
          fi

          echo "Downloading APK from: $BUILD_URL"
          curl -L -o app.apk "$BUILD_URL"

          if [ ! -s app.apk ]; then
            echo "::error::Downloaded APK is empty"
            exit 1
          fi

          echo "apk_path=apps/mobile/app.apk" >> "$GITHUB_OUTPUT"
          echo "APK downloaded ($(du -h app.apk | cut -f1))"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-${{ runner.os }}

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install ${{ steps.download-apk.outputs.apk_path }}
            adb shell pm list packages | grep dydyd && echo "App installed successfully"
            maestro test apps/mobile/.maestro/

      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests/
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            ~/.maestro/tests/**/*.png
            ~/.maestro/tests/**/*.jpg
          retention-days: 14
