version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "@types/jest"
      lint-format:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
      turbo:
        patterns:
          - "turbo"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
